name: Fork ARM64 validation - mujoco
'on':
  push:
    branches:
    - hermes-ci/windows-arm64-8b0d5ba1731a
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: fork-arm64-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows-arm64:
    name: windows-11-arm / CPython ${{ matrix.python }}
    runs-on: windows-11-arm
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python:
        - '3.12'
        - '3.13'
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '3'
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        persist-credentials: false
        ref: 8b0d5ba1731a115dce2c3710888af491d50e6c58
    - name: Verify exact public PR source revision
      shell: pwsh
      run: '$actual = git rev-parse HEAD

        if ($actual -ne ''8b0d5ba1731a115dce2c3710888af491d50e6c58'') { throw ''Source revision mismatch'' }

        Write-Output (''TESTED_SOURCE_SHA=''+$actual)'
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: ${{ matrix.python }}
        architecture: arm64
    - name: Select isolated native build workspace
      shell: pwsh
      run: '"MUJOCO_ARM64_WORK=$env:RUNNER_TEMP/mujoco-arm64" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'
    - name: Configure native ARM64 MSVC and Windows SDK
      shell: pwsh
      run: "$vswhere = \"${env:ProgramFiles(x86)}\\Microsoft Visual Studio\\Installer\\vswhere.exe\"\n$vsPath = & $vswhere -products * -latest -prerelease -property installationPath\n$vcvars = Join-Path $vsPath \"VC\\Auxiliary\\Build\\vcvarsall.bat\"\n$before = @{}\nGet-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }\n$lines = cmd.exe /c \"`\"$vcvars`\" arm64 >nul && set\"\nif ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\nforeach ($line in $lines) {\n  $idx = $line.IndexOf(\"=\")\n  if ($idx -gt 0) {\n    $name = $line.Substring(0, $idx)\n    $val = $line.Substring($idx + 1)\n    if ($before[$name] -ne $val) {\n      \"$name=$val\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append\n    }\n  }\n}\n"
    - name: Install build tools
      run: python -m pip install cmake ninja setuptools wheel build absl-py zstandard
    - name: Build, audit, and test native CPU wheels
      run: python .github/workflows/windows_arm64.py
    - name: Upload native wheel and test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: windows-arm64-cp${{ matrix.python }}
        path: '${{ env.MUJOCO_ARM64_WORK }}/package/dist/*.whl

          ${{ env.MUJOCO_ARM64_WORK }}/tests.xml

          '
    permissions:
      contents: read
    if: github.repository_owner == 'johnnynunez'
